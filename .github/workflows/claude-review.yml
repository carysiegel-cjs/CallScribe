name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip (no ANTHROPIC_API_KEY secret yet)
        if: env.HAS_KEY != 'true'
        run: echo "Add the ANTHROPIC_API_KEY repository secret to enable automatic reviews."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for CallScribe (Next.js + Supabase + AssemblyAI + Claude + Stripe).
            Focus on, in order:
            1. Security: authorization bypass, RLS/grant changes in supabase/schema.sql, secrets, CSRF, open redirects.
            2. Billing and quota correctness (usage_events, create_call, Stripe webhook reconciliation).
            3. Job pipeline correctness (claim tokens, retries, timeouts) and data integrity.
            4. Bugs and crashes in UI flows.
            Skip pure style nits. Use inline comments for specific lines and one summary comment.
            If supabase/schema.sql changes, check supabase/tests/10_schema_test.sql still covers it.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
