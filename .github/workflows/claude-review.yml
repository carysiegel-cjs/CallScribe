name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      # The Anthropic key may be saved under any of these names.
      HAS_KEY: ${{ (secrets.ANTHROPIC_API_KEY || secrets.CALLSCRIBE_KEY || secrets.CALLSCRIBE_API_KEY || secrets.CALLSCRIBE || secrets.CALL_SCRIBE_KEY || secrets.ANTHROPIC_KEY || secrets.CLAUDE_API_KEY) != '' }}
    steps:
      - name: Skip (no Anthropic key secret yet)
        if: env.HAS_KEY != 'true'
        run: echo "No Anthropic key secret found (looked for ANTHROPIC_API_KEY, CALLSCRIBE_KEY, CALLSCRIBE_API_KEY, CALLSCRIBE, CALL_SCRIBE_KEY, ANTHROPIC_KEY, CLAUDE_API_KEY); skipping review."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY || secrets.CALLSCRIBE_KEY || secrets.CALLSCRIBE_API_KEY || secrets.CALLSCRIBE || secrets.CALL_SCRIBE_KEY || secrets.ANTHROPIC_KEY || secrets.CLAUDE_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for CallScribe (Next.js + Supabase + AssemblyAI + Claude + Stripe).
            Focus on, in order:
            1. Security: authorization bypass, RLS/grant changes in supabase/schema.sql, secrets, CSRF, open redirects.
            2. Billing and quota correctness (usage_events, create_call, Stripe webhook reconciliation).
            3. Job pipeline correctness (claim tokens, retries, timeouts) and data integrity.
            4. Bugs and crashes in UI flows.
            Skip pure style nits. Use inline comments for specific lines and one summary comment.
            If supabase/schema.sql changes, check supabase/tests/10_schema_test.sql still covers it.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
